<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The link preview for helthtransfer.com, 1200 x 630. store/compose.sh renders it. -->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #15171b; }
  body { font-family: -apple-system, "SF Pro Display", sans-serif; -webkit-font-smoothing: antialiased; }
  .text { position: absolute; left: 84px; top: 150px; width: 680px; }
  .mark { display: flex; align-items: center; gap: 16px; color: #f4f2ee; font-size: 34px; font-weight: 700; letter-spacing: -0.01em; }
  .mark img { width: 56px; height: 56px; border-radius: 13px; }
  h1 { margin: 26px 0 0; color: #f4f2ee; font-size: 62px; line-height: 1.08; font-weight: 700; letter-spacing: -0.015em; }
  p { margin: 26px 0 0; color: #a7a49e; font-size: 28px; line-height: 1.35; }
  .phone { position: absolute; left: 790px; top: 70px; width: 330px; padding: 2px; border-radius: 54px; background: linear-gradient(160deg, #4a4b4f, #232427 40%, #3b3c40); }
  .bezel { padding: 7px; border-radius: 52px; background: #000; }
  .screen { position: relative; border-radius: 45px; overflow: hidden; }
  .screen img { display: block; width: 100%; }
  .island { position: absolute; top: 9px; left: 50%; width: 97px; height: 29px; margin-left: -48px; border-radius: 15px; background: #000; }
</style>
</head>
<body>
<div class="text">
  <div class="mark"><img src="icon-source.jpg" alt="">Hëlth</div>
  <h1>Moves your Health data.<br>Collects none of it.</h1>
  <p>From one iPhone to the other by AirDrop.</p>
</div>
<div class="phone"><div class="bezel"><div class="screen"><img src="raw/home.png" alt=""><div class="island"></div></div></div></div>
</body>
</html>
