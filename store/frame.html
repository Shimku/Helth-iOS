<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- One App Store screenshot, 1320 x 2868: frame.html?n=1 ... (store/compose.sh renders them all).
     frame.html?n=1&d=duo is the iPhone Duo version, 2853 x 2007, from the inner display's screens. -->
<style>
  :root {
    --bg: #15171b;
    --ink: #f4f2ee;
    --soft: #a7a49e;
  }
  html, body { margin: 0; width: 1320px; height: 2868px; overflow: hidden; background: var(--bg); }
  body { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  .text { position: absolute; left: 104px; right: 104px; top: 196px; }
  h1 { margin: 0; color: var(--ink); font-size: 100px; line-height: 1.06; font-weight: 700; letter-spacing: -0.015em; white-space: pre-line; }
  p { margin: 36px 0 0; color: var(--soft); font-size: 50px; line-height: 1.3; font-weight: 400; text-wrap: pretty; }
  .phone { position: absolute; left: 100px; width: 1120px; top: 700px; padding: 7px; box-sizing: border-box;
           border-radius: 182px; background: linear-gradient(160deg, #4a4b4f, #232427 40%, #3b3c40); }
  .bezel { padding: 23px; border-radius: 175px; background: #000; }
  .screen { position: relative; border-radius: 152px; overflow: hidden; background: #fff; }
  .screen img { display: block; width: 100%; }
  .island { position: absolute; top: 30px; left: 50%; width: 330px; height: 97px; margin-left: -165px; border-radius: 49px; background: #000; }
  /* iPhone Duo, inner display (open, landscape): no Dynamic Island, the status bar is down the right edge. */
  .duo, .duo body { width: 2853px; height: 2007px; }
  .duo .text { left: 200px; right: 200px; top: 150px; }
  .duo h1 { font-size: 120px; }
  .duo p { margin-top: 40px; font-size: 58px; }
  .duo .phone { left: 200px; width: 2453px; top: 640px; border-radius: 120px; }
  .duo .bezel { border-radius: 113px; }
  .duo .screen { border-radius: 90px; }
  .duo .island { display: none; }
</style>
</head>
<body>
<div class="text"><h1 id="h"></h1><p id="s"></p></div>
<div class="phone"><div class="bezel"><div class="screen"><img id="i" alt=""><div class="island"></div></div></div></div>
<script>
  const slides = [
    ["home", "Moves your Health data.\nCollects none of it.", "Straight from one iPhone to the other by AirDrop. No account, no servers."],
    ["send-done", "All of it, in one file", "Steps, sleep, workouts and routes, heart rate and the rest, back to the first day."],
    ["receive-plan", "See what's in it\nbefore you copy", "Nothing on the iPhone is changed or replaced."],
    ["receive-done", "Nothing is copied twice", "Anything that's already there is skipped, so it's safe to run again."],
    ["receive-waiting", "Works without Hëlth\non the old iPhone", "Export from the Health app there, then open export.zip here."],
    ["home-privacy", "It never goes online", "There's no internet code in it at all. Your data goes by AirDrop and nowhere else."],
  ];
  const q = new URLSearchParams(location.search);
  const n = +(q.get("n") || 1), duo = q.get("d") === "duo";
  if (duo) document.documentElement.className = "duo";
  const [img, head, sub] = slides[n - 1];
  document.getElementById("h").textContent = head;
  document.getElementById("s").textContent = sub;
  document.getElementById("i").src = (duo ? "raw-duo/" : "raw/") + img + ".png";
  document.title = slides.length;
</script>
</body>
</html>
